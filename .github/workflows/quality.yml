name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metricas-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Executar testes
        id: tests
        continue-on-error: true
        run: |
          mkdir -p quality-reports
          npm test -- --reporter=junit --outputFile=quality-reports/vitest-junit.xml

      - name: Executar LCP P75
        id: lcp
        continue-on-error: true
        run: npm run quality:lcp

      - name: Executar métrica de acessibilidade
        id: accessibility
        continue-on-error: true
        run: npm run quality:a11y

      - name: Gerar relatórios por atributo
        if: always()
        env:
          QUALITY_COMMIT: ${{ github.sha }}
          QUALITY_ENVIRONMENT: GitHub Actions / ubuntu-latest / Node 22.22.2 / Lighthouse desktop local
        run: npm run quality:report

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-frontend-${{ github.sha }}
          if-no-files-found: error
          path: |
            docs/quality/*.md
            quality-reports/**
            .lighthouseci/*.json
            playwright-report/**
            test-results/**

      - name: Aplicar gates
        if: always() && (steps.tests.outcome != 'success' || steps.lcp.outcome != 'success' || steps.accessibility.outcome != 'success')
        run: |
          echo 'Testes, LCP P75 ou acessibilidade falharam.' >&2
          exit 1
